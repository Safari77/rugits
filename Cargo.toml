[package]
name = "rugits"
version = "0.5.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
authors = ["Sami Farin"]
description = "Drop-in replacement for OpenSSH ssh-keygen -Y signature operations (SSHSIG) and Git commit/tag signing"
keywords = ["ssh", "git", "ssh-keygen", "sshsig", "signature"]
categories = ["command-line-utilities", "cryptography", "development-tools", "authentication"]

[dependencies]
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rpassword = "7.5"
sha2 = "0.11"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "crypto", "std", "encryption", "alloc"] }
tempfile = "3.27"
zeroize = "1.9"

[profile.release]
opt-level = 3
debug = true
strip = false
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
mem_forget = "deny"
large_futures = "warn"
